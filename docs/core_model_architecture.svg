<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">最终模型方法架构图</title>
  <desc id="desc">最终模型方法架构：统一特征表示、LightGBM 调参、Random Forest 互补和融合策略。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,6 L0,12 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,6 L0,12 Z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 46px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 24px; fill: #475569; }
      .node-title { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .node-text { font-size: 20px; fill: #334155; }
      .metric { font-size: 26px; font-weight: 800; fill: #166534; }
      .note-title { font-size: 23px; font-weight: 800; fill: #0f172a; }
      .note-text { font-size: 19px; fill: #475569; }
      .footer { font-size: 20px; fill: #475569; }
      .feature { fill: #f0fdfa; stroke: #0f766e; stroke-width: 4; }
      .tune { fill: #fff7ed; stroke: #ea580c; stroke-width: 4; }
      .lgb { fill: #ffedd5; stroke: #c2410c; stroke-width: 4; }
      .rf { fill: #fef2f2; stroke: #dc2626; stroke-width: 4; }
      .blend { fill: #dcfce7; stroke: #16a34a; stroke-width: 5; }
      .out { fill: #e0f2fe; stroke: #0284c7; stroke-width: 5; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 3; }
      .arrow-blue { stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow-blue); fill: none; }
      .arrow-orange { stroke: #ea580c; stroke-width: 5; marker-end: url(#arrow-orange); fill: none; }
      .arrow-green { stroke: #16a34a; stroke-width: 5; marker-end: url(#arrow-green); fill: none; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text class="title" x="960" y="76" text-anchor="middle">最终模型方法架构图</text>
  <text class="subtitle" x="960" y="118" text-anchor="middle">核心是模型方法：特征表示、LGB 调参、RF 互补与加权融合</text>

  <rect class="feature" x="90" y="300" width="330" height="300" rx="22" filter="url(#shadow)"/>
  <text class="node-title" x="255" y="360" text-anchor="middle">统一特征表示</text>
  <text class="node-text" x="255" y="408" text-anchor="middle">时间拆解：hour / day / month</text>
  <text class="node-text" x="255" y="448" text-anchor="middle">等待时长：request→pickup / scene</text>
  <text class="node-text" x="255" y="488" text-anchor="middle">8 类业务类别 One-Hot</text>
  <text class="node-text" x="255" y="528" text-anchor="middle">数值列转 float 并填补</text>

  <rect class="tune" x="515" y="215" width="330" height="240" rx="22" filter="url(#shadow)"/>
  <text class="node-title" x="680" y="275" text-anchor="middle">LightGBM 参数搜索</text>
  <text class="node-text" x="680" y="323" text-anchor="middle">学习率 0.04</text>
  <text class="node-text" x="680" y="363" text-anchor="middle">叶子数 63 / 深度 7</text>
  <text class="node-text" x="680" y="403" text-anchor="middle">采样 + L1/L2 正则</text>

  <rect class="lgb" x="940" y="215" width="330" height="240" rx="22" filter="url(#shadow)"/>
  <text class="node-title" x="1105" y="275" text-anchor="middle">优化 LGB 单模型</text>
  <text class="node-text" x="1105" y="323" text-anchor="middle">160 轮全量训练</text>
  <text class="node-text" x="1105" y="363" text-anchor="middle">控制树容量与过拟合</text>
  <text class="node-text" x="1105" y="403" text-anchor="middle">RMSE = 2.0229</text>

  <rect class="rf" x="515" y="570" width="330" height="220" rx="22" filter="url(#shadow)"/>
  <text class="node-title" x="680" y="628" text-anchor="middle">Random Forest 互补</text>
  <text class="node-text" x="680" y="676" text-anchor="middle">Bagging 降低方差</text>
  <text class="node-text" x="680" y="716" text-anchor="middle">100 棵树</text>
  <text class="node-text" x="680" y="756" text-anchor="middle">max_depth = 20</text>

  <rect class="blend" x="1365" y="335" width="350" height="260" rx="24" filter="url(#shadow)"/>
  <text class="node-title" x="1540" y="395" text-anchor="middle">预测融合策略</text>
  <text class="node-text" x="1540" y="444" text-anchor="middle">LGB：梯度提升信号</text>
  <text class="node-text" x="1540" y="484" text-anchor="middle">RF：方差互补</text>
  <text class="node-text" x="1540" y="524" text-anchor="middle">0.5 / 0.5 加权平均</text>

  <rect class="out" x="1365" y="690" width="350" height="160" rx="22" filter="url(#shadow)"/>
  <text class="node-title" x="1540" y="745" text-anchor="middle">最终方法输出</text>
  <text class="metric" x="1540" y="792" text-anchor="middle">RMSE = 1.9625</text>
  <text class="node-text" x="1540" y="830" text-anchor="middle">较最佳 baseline 提升 5.6%</text>

  <rect class="note" x="940" y="520" width="330" height="150" rx="18"/>
  <text class="note-title" x="1105" y="570" text-anchor="middle">调参目标</text>
  <text class="note-text" x="1105" y="612" text-anchor="middle">提升单模型精度</text>
  <text class="note-text" x="1105" y="646" text-anchor="middle">避免过拟合</text>

  <rect class="note" x="90" y="720" width="330" height="130" rx="18"/>
  <text class="note-title" x="255" y="765" text-anchor="middle">方法约束</text>
  <text class="note-text" x="255" y="806" text-anchor="middle">同一特征表示下比较模型</text>

  <path class="arrow-blue" d="M420 405 L515 335"/>
  <path class="arrow-blue" d="M420 520 L515 680"/>
  <path class="arrow-orange" d="M845 335 L940 335"/>
  <path class="arrow-green" d="M1270 335 C1328 335 1310 465 1365 465"/>
  <path class="arrow-green" d="M845 680 C1050 680 1190 522 1365 522"/>
  <path class="arrow-green" d="M1540 595 L1540 690"/>
  <path class="arrow-orange" d="M1105 455 L1105 520"/>
  <path class="arrow-blue" d="M255 600 L255 720"/>

  <rect x="90" y="925" width="1625" height="78" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="footer" x="902" y="974" text-anchor="middle">方法主线：显式特征表示保持可比性，LGB 调参提升单模型，RF 提供互补，最终通过简单融合获得稳定增益。</text>
</svg>
